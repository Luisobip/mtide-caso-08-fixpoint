version: 2
models:
  - name: stg_parte
    description: "El parte diario limpio, con las dos entregas"
    columns:
      - name: resguardo
        data_tests: [unique, not_null]
      - name: tecnico
        data_tests: [not_null]
      - name: tipo_reparacion
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["pantalla", "batería", "conector de carga", "cámara", "placa base", "altavoz", "daño por agua", "tapa trasera"]
